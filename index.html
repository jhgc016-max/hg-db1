<script>

function board(type){let items=visiblePosts(type),content='';if(type==='notice'||type==='resource')content=items.length?`<div class="card tablewrap"><table class="listing"><thead><tr><th style="width:74px">번호</th><th>제목</th><th class="hideMobile" style="width:130px">작성일</th><th style="width:98px">첨부</th></tr></thead><tbody>${items.map((p,i)=>`<tr><td>${items.length-i}</td><td><button class="linktitle" data-post="${p.id}">${esc(p.title)}</button></td><td class="hideMobile">${time(p.created_at)}</td><td>${p.file_path?'<span class="tag">파일</span>':'-'}</td></tr>`).join('')}</tbody></table></div>`:'';

return top(names[type],subnames[type])+`<div class="section"><div class="wrap">${!user?memberGate():headerActions(type)+(content||'<div class="empty"><strong>등록된 게시글이 없습니다</strong>첫 번째 이야기를 올려보세요.</div>')}</div></div>`}
function dashboard(){if(!user)return top('대시보드','회원 전용 프로젝트 현황')+`<div class="section"><div class="wrap">${memberGate()}</div></div>`;
const counts=['notice','webzine','resource','gallery'].map(c=>posts.filter(p=>p.category===c).length);
const recent=posts.slice(0,6);
return top('대시보드','프로젝트 소식과 나의 참여 상태를 확인합니다.')+`<div class="section"><div class="wrap"><div class="grid">${[['공지사항',counts[0]],['자유게시판',counts[1]],['자료실',counts[2]],['갤러리',counts[3]]].map(x=>`<div class="card metric"><p>${x[0]}</p><div class="number">${x[1]}</div><p>등록된 게시글</p></div>`).join('')}</div><div style="height:22px"></div><div class="dashrow"><div class="card dashbox"><h3>최근 업데이트</h3>${recent.length?recent.map(p=>`<div class="minirow"><button class="linktitle" data-post="${p.id}">${esc(p.title)}</button><span class="smalltext">${time(p.created_at)}</span></div>`).join(''):'<p class="smalltext">아직 등록된 내용이 없습니다.</p>'}</div><div class="card dashbox"><h3>나의 참여 신청</h3>${applications.filter(a=>a.user_id===user.id).length?applications.filter(a=>a.user_id===user.id).map(a=>`<div class="minirow"><span>${esc(a.project_name)}</span><span class="tag ${a.status==='approved'?'green':'amber'}">${({pending:'검토 중',approved:'승인',rejected:'반려'})[a.status]}</span></div>`).join(''):'<p class="smalltext">신청 내역이 없습니다.</p>'}<button class="btn small" data-page="participate" style="margin-top:15px">참여 신청하기</button></div></div>${profile?.role==='admin'?`<div class="card dashbox" style="margin-top:20px"><h3>관리자 · 프로젝트 참여 신청</h3>${applications.length?`<div class="tablewrap"><table class="listing"><thead><tr><th>신청자 ID</th><th>참여 동기</th><th>상태</th><th>접수일</th></tr></thead><tbody>${applications.map(a=>`<tr><td>${esc(a.user_id.slice(0,8))}…</td><td>${esc(a.motivation)}</td><td>${esc(a.status)}</td><td>${time(a.created_at)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="smalltext">신청 내역이 없습니다.</p>'}<p class="hint">승인·반려는 초기 버전에서 Supabase SQL Editor를 이용합니다.</p></div>`:''}</div></div>`}
function participate(){const mine=applications.find(a=>a.user_id===user?.id && a.project_name==='사내 프로젝트');return top('프로젝트 참여','작은 제안이 의미 있는 결과로 이어지도록 함께해 주세요.')+`<section class="section"><div class="wrap" style="max-width:840px"><div class="card article"><div class="kicker">JOIN THE PROJECT</div><h2>프로젝트 참여 안내</h2><p>홍보실이 운영하는 사내 프로젝트에 여러분의 제안과 전문성을 더해 주세요. 운영 소식은 공지사항에서 확인하고, 자료실에서 참고 자료를 열람할 수 있습니다.</p><div class="sidepanel"><b>참여 절차</b><p class="hint">① 직원 회원가입·이메일 인증 → ② 게시판에서 프로젝트 확인 → ③ 참여 동기 작성 → ④ 담당자 검토</p></div>${!user?memberGate():mine?`<div class="signinNotice">신청이 접수되었습니다. 현재 상태: <b>${esc(({pending:'검토 중',approved:'승인',rejected:'반려'})[mine.status])}</b></div><p class="hint">프로젝트별 중복 신청은 제한됩니다. 수정이 필요하면 운영 담당자에게 문의해 주세요.</p>`:`<form id="applicationForm" class="formgrid"><div class="field"><label>프로젝트명</label><input value="사내 프로젝트" disabled></div><div class="field"><label for="motivation">참여 동기 또는 제안 (10~2,000자)</label><textarea id="motivation" name="motivation" minlength="10" maxlength="2000" required placeholder="어떤 이유로 참여하고 싶은지, 어떤 기여를 할 수 있을지 적어 주세요."></textarea></div><button class="btn" type="submit">참여 신청 제출 →</button></form>`}</div></div></section>`}
function render(){route=decodeURIComponent(location.hash.replace(/^#/,''))||'home';if(!['home','dashboard','notice','webzine','resource','gallery','participate'].includes(route))route='home';navState();const app=$('#app');app.innerHTML=route==='home'?home():route==='dashboard'?dashboard():route==='participate'?participate():board(route);if(route==='gallery'&&user)loadGalleryImages();}
async function refresh(){if(!db)return tell('Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');if(!user){posts=[];applications=[];render();return}const [p,a,pr]=await Promise.all([db.from('posts').select('*').order('created_at',{ascending:false}).limit(200),db.from('project_applications').select('*').order('created_at',{ascending:false}),db.from('profiles').select('*').eq('id',user.id).maybeSingle()]);if(p.error)tell('게시글을 불러오지 못했습니다: '+p.error.message);posts=p.data||[];profile=pr.data||null;applications=a.data||[];render()}
async function loadGalleryImages(){const thisRoute=route;for(const p of visiblePosts('gallery')){if(!p.file_path)continue;let url=cacheImages.get(p.file_path);if(!url){const {data,error}=await db.storage.from('project-files').createSignedUrl(p.file_path,1800);if(!error&&data?.signedUrl){url=data.signedUrl;cacheImages.set(p.file_path,url)}}const node=document.getElementById('img-'+p.id);if(node&&thisRoute===route&&url){const im=document.createElement('img');im.src=url;im.alt=p.title;im.loading='lazy';node.replaceChildren(im)}}}
function modal(inner){$('#modalRoot').innerHTML=`<div class="modalback" id="modalBack"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`}
function modalHead(title){return `<div class="modalhead"><h2>${esc(title)}</h2><button class="close" data-close aria-label="닫기">×</button></div>`}
function authModal(mode){modal(modalHead(mode==='signup'?'직원 회원가입':'로그인')+`<form class="formgrid" id="authForm"><input type="hidden" name="mode" value="${mode}">${mode==='signup'?`<div class="field"><label for="display_name">이름</label><input id="display_name" name="display_name" minlength="2" maxlength="40" required placeholder="홍길동"></div><div class="field"><label for="department">부서</label><input id="department" name="department" maxlength="60" placeholder="예: 홍보실"></div>`:''}<div class="field"><label for="email">${mode==='signup'?'사내 이메일':'이메일'}</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="name@company.com"></div><div class="field"><label for="password">비밀번호 (6자 이상)</label><input id="password" name="password" type="password" required minlength="6" autocomplete="${mode==='signup'?'new-password':'current-password'}"></div><p class="hint">${mode==='signup'?'가입 후 인증 메일이 발송될 수 있습니다. 실제 직원 여부를 확인하려면 Supabase Auth의 회사 도메인 제한 또는 초대 방식 운영을 추가로 설정해야 합니다.':'인증 메일 확인 후 로그인이 가능합니다.'}</p><button class="btn" type="submit">${mode==='signup'?'회원가입':'로그인'}</button></form><div class="actionrow"><button class="btn light small" data-auth="${mode==='signup'?'login':'signup'}">${mode==='signup'?'이미 계정이 있나요? 로그인':'처음이신가요? 회원가입'}</button></div>`)}
function writeModal(type){if(!user)return authModal('login');if(type==='notice'&&profile?.role!=='admin')return tell('공지는 관리자만 작성할 수 있습니다.');modal(modalHead(names[type]+' 글 작성')+`<form id="writeForm" class="formgrid"><input type="hidden" name="category" value="${type}"><div class="field"><label>제목 (160자 이내)</label><input name="title" maxlength="160" required></div><div class="field"><label>내용</label><textarea name="body" maxlength="30000" placeholder="공유할 내용을 작성해 주세요."></textarea></div>${type==='resource'||type==='gallery'?`<div class="field"><label>${type==='gallery'?'이미지 선택 (필수)':'첨부파일 (선택)'}, 최대 15MB</label><input type="file" name="upload" ${type==='gallery'?'accept="image/png,image/jpeg,image/webp,image/gif" required':''}></div>`:''}<button type="submit" class="btn">등록하기</button></form>`)}
async function viewPost(id){const p=posts.find(x=>x.id===id);if(!p)return tell('게시글을 찾지 못했습니다.');const canDelete=user&&(user.id===p.author_id||profile?.role==='admin');modal(modalHead(names[p.category])+`<article class="article" style="padding:0"><span class="tag">${esc(names[p.category])}</span><h2>${esc(p.title)}</h2><div class="smalltext">작성일 ${time(p.created_at)}</div><div id="detailImg"></div><div class="body">${esc(p.body)}</div><div class="actionrow">${p.file_path?`<button class="btn light" data-download="${p.id}">📎 ${esc(p.file_name)} 다운로드</button>`:''}${canDelete?`<button class="btn danger" data-delete="${p.id}">글 삭제</button>`:''}</div></article>`);if(p.category==='gallery'&&p.file_path){const {data}=await db.storage.from('project-files').createSignedUrl(p.file_path,1200);if(data?.signedUrl&&$('#detailImg')){const im=document.createElement('img');im.className='articleimage';im.alt=p.title;im.src=data.signedUrl;$('#detailImg').appendChild(im)}}}
async function savePost(form){if(busy)return;setBusy(true);let path=null;try{const f=new FormData(form),cat=f.get('category'),title=String(f.get('title')||'').trim(),body=String(f.get('body')||'').trim(),file=f.get('upload');if(!title||title.length>160)throw Error('제목을 확인해 주세요.');if(cat==='gallery'&&(!file||!file.size))throw Error('갤러리 이미지를 선택해 주세요.');let info={category:cat,title,body,author_id:user.id};if(file instanceof File && file.size){if(file.size>15*1024*1024)throw Error('파일은 15MB 이하만 업로드할 수 있습니다.');if(cat==='gallery'&&!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type))throw Error('JPG, PNG, WEBP, GIF만 업로드할 수 있습니다.');const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8)||'bin';path=`${user.id}/${crypto.randomUUID()}.${ext}`;const uploaded=await db.storage.from('project-files').upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});if(uploaded.error)throw uploaded.error;info.file_path=path;info.file_name=file.name.slice(0,200);info.mime_type=file.type||'application/octet-stream'}const {error}=await db.from('posts').insert(info);if(error)throw error;$('#modalRoot').innerHTML='';tell('게시글이 등록되었습니다.');await refresh()}catch(e){if(path)await db.storage.from('project-files').remove([path]);tell('등록 실패: '+e.message)}finally{setBusy(false)}}
async function downloadPost(id){const p=posts.find(x=>x.id===id);if(!p?.file_path)return;const {data,error}=await db.storage.from('project-files').download(p.file_path);if(error)return tell('다운로드 오류: '+error.message);const url=URL.createObjectURL(data),a=document.createElement('a');a.href=url;a.download=p.file_name||'download';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
async function deletePost(id){const p=posts.find(x=>x.id===id);if(!p||!confirm('게시글을 삭제하시겠습니까?'))return;const {error}=await db.from('posts').delete().eq('id',id);if(error)return tell('삭제 실패: '+error.message);if(p.file_path){const {error:se}=await db.storage.from('project-files').remove([p.file_path]);if(se)tell('게시글은 삭제되었으나 첨부파일 정리는 실패했습니다.')}$('#modalRoot').innerHTML='';await refresh();tell('게시글이 삭제되었습니다.')}
async function authSubmit(form){if(busy)return;setBusy(true);try{const f=new FormData(form),email=String(f.get('email')).trim(),password=String(f.get('password')),mode=f.get('mode');if(mode==='signup'){const name=String(f.get('display_name')).trim(),dept=String(f.get('department')).trim();if(name.length<2)throw Error('이름을 2자 이상 입력해 주세요.');const {data,error}=await db.auth.signUp({email,password,options:{data:{display_name:name,department:dept}}});if(error)throw error;$('#modalRoot').innerHTML='';tell(data.session?'가입 및 로그인이 완료되었습니다.':'가입 요청을 받았습니다. 인증 메일을 확인한 뒤 로그인해 주세요.')}else{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;$('#modalRoot').innerHTML='';tell('로그인되었습니다.')}}catch(e){tell('인증 오류: '+e.message)}finally{setBusy(false)}}
async function submitApplication(form){if(busy)return;setBusy(true);try{const motivation=String(new FormData(form).get('motivation')||'').trim();if(motivation.length<10)throw Error('참여 동기를 10자 이상 작성해 주세요.');const {error}=await db.from('project_applications').insert({user_id:user.id,project_name:'사내 프로젝트',motivation});if(error)throw error;tell('참여 신청이 접수되었습니다.');await refresh()}catch(e){tell('신청 실패: '+e.message)}finally{setBusy(false)}}
document.addEventListener('click',async e=>{const n=e.target.closest('[data-page],[data-auth],[data-write],[data-post],[data-download],[data-delete],[data-close],#loginBtn,#joinBtn,#logoutBtn,#modalBack');if(!n)return;if(n.id==='modalBack'){if(e.target===n)$('#modalRoot').innerHTML='';return}if(n.hasAttribute('data-close'))return $('#modalRoot').innerHTML='';if(n.dataset.page){searchTerm='';go(n.dataset.page);window.scrollTo({top:0,behavior:'smooth'});return}if(n.dataset.auth)return authModal(n.dataset.auth);if(n.id==='loginBtn')return authModal('login');if(n.id==='joinBtn')return authModal('signup');if(n.id==='logoutBtn'){await db.auth.signOut();tell('로그아웃되었습니다.');return}if(n.dataset.write)return writeModal(n.dataset.write);if(n.dataset.post)return viewPost(n.dataset.post);if(n.dataset.download)return downloadPost(n.dataset.download);if(n.dataset.delete)return deletePost(n.dataset.delete)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modalRoot').innerHTML='';if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=link][data-page],[role=link][data-post]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.id==='postSearch'){const pos=e.target.selectionStart;searchTerm=e.target.value;const type=route;const list=document.querySelector('.section .wrap');if(!list)return;const fresh=document.createElement('div');fresh.innerHTML=board(type);const newSection=fresh.querySelector('.section .wrap');if(newSection){list.innerHTML=newSection.innerHTML;const input=$('#postSearch');input?.focus();input?.setSelectionRange(pos,pos);if(type==='gallery')loadGalleryImages()}}});
document.addEventListener('submit',e=>{if(e.target.id==='authForm'){e.preventDefault();authSubmit(e.target)}else if(e.target.id==='writeForm'){e.preventDefault();savePost(e.target)}else if(e.target.id==='applicationForm'){e.preventDefault();submitApplication(e.target)}});
window.addEventListener('hashchange',()=>{searchTerm='';render()});
(async()=>{render();if(!db)return tell('Supabase SDK가 로드되지 않았습니다. 인터넷 연결을 확인하세요.');const {data:{session}}=await db.auth.getSession();user=session?.user||null;db.auth.onAuthStateChange((_event,session)=>{const newId=session?.user?.id||null;if(newId!==user?.id){user=session?.user||null;profile=null;cacheImages.clear();setTimeout(refresh,0)}});await refresh()})();
</script>
</body></html>
